<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TeamWork · 工作组</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/components.css">
<style>
#nm-tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:none}
#nm-tools{display:flex;gap:.4rem;flex-wrap:wrap;flex:none}
#nm-tools .btn{padding:.35rem .7rem;font-size:var(--fsS)}
.nm-who{font-size:11px;fill:var(--dim)}
.nm-lab{font-size:11px;fill:var(--mut)}
.nm-pop{animation:nmpop .35s ease}
#svg.nm-quiet .nm-pop{animation:none} /* ★ v4.6.6 视图变换（平移/缩放/拖节点）重绘不重放入场动画 */
#svg{position:static;inset:auto;width:auto;height:auto;pointer-events:auto;user-select:none;-webkit-user-select:none;-ms-user-select:none;touch-action:none} /* ★ v4.6.8 根因修复：全局 style.css 的 #svg 规则（lobby 背景装饰用：absolute 铺满 + pointer-events:none）误伤本页地图——地图 SVG 从未收到过任何鼠标事件，拖动/平移/缩放自 v4.6.6 起从未生效；此处覆盖恢复 flex 流布局（不遮工具栏）+ 开启鼠标交互 */
#svg.nm-dragging,#svg.nm-dragging *{cursor:grabbing!important} /* ★ v4.6.7 拖动中光标反馈 */
@keyframes nmpop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
#nm-detail{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;backdrop-filter:blur(4px)}
#nm-detail .form-card{margin:4rem auto;max-width:560px;max-height:75vh;overflow-y:auto}
#nd-title{font-size:var(--fsL)}
/* ★ 统一 UI 组件（v4.3 UI 整改）：页面内弹框 + Toast，风格对齐 .form-card/.fg/.err-msg */
#nm-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:120;backdrop-filter:blur(4px)}
#nm-modal .form-card{margin:6rem auto;max-width:460px;padding:1.6rem}
#nm-m-body .fg{margin-bottom:.9rem}
#nm-m-txt{font-size:var(--fsS);line-height:1.8;color:var(--mut);white-space:pre-wrap;word-break:break-word;max-height:46vh;overflow-y:auto}
#nm-toast{position:fixed;top:70px;right:18px;z-index:130;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.nm-toast-it{background:rgba(15,18,35,.92);border:1px solid var(--pb);border-left:3px solid #34d399;border-radius:.6rem;padding:.7rem 1rem;font-size:var(--fsS);color:var(--txt);max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:nmtoi .25s ease}
.nm-toast-it.err{border-left-color:#f43f5e}
@keyframes nmtoi{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
#w-consensus{font-size:var(--fsS)}
/* ★ 侧栏滚动区（Memory/Skill，风格一致：细轨道半透明滑块）*/
.nm-scroll{max-height:200px;overflow-y:auto;padding-right:.25rem;flex:none}
.nm-scroll::-webkit-scrollbar{width:5px}
.nm-scroll::-webkit-scrollbar-track{background:transparent}
.nm-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.nm-scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28)}
.nm-mem-it{padding:.4rem .45rem;border-radius:.5rem;cursor:pointer;transition:.15s;display:flex;gap:.45rem;align-items:flex-start}
.nm-mem-it:hover{background:rgba(255,255,255,.05)}
.nm-mem-dot{width:7px;height:7px;border-radius:99px;margin-top:6px;flex:none}
.nm-mem-tt{font-size:var(--fsX);color:var(--mut);line-height:1.45;overflow:hidden}
.nm-mem-mt{font-size:var(--fsX);color:var(--dim);white-space:nowrap}
.nm-skill-it{padding:.45rem .5rem;border-radius:.5rem;cursor:pointer;transition:.15s;font-size:var(--fsX);color:var(--mut);border-bottom:1px solid rgba(255,255,255,.05)}
.nm-skill-it:hover{background:rgba(255,255,255,.05)}
.nm-count-badge{font-size:var(--fsX);color:var(--dim);font-weight:400}
/* ★ v4.3.2 地图选项卡 + 底部节点信息栏 */
.nm-tab{padding:.25rem .85rem;font-size:var(--fsS);border-radius:99px;border:1px solid var(--pb);background:rgba(255,255,255,.04);color:var(--mut);cursor:pointer;transition:.15s;font-weight:600}
.nm-tab:hover{background:rgba(255,255,255,.08)}
.nm-tab.active{background:linear-gradient(135deg,#6366f1,#22d3ee);color:#fff;border-color:transparent}
#nm-info-bar{position:absolute;left:0;right:0;bottom:0;min-height:56px;background:rgba(15,18,35,.92);backdrop-filter:blur(10px);border-top:1px solid var(--pb);padding:.55rem .9rem;display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;z-index:9;font-size:var(--fsS)}
#nm-info-bar .ib-emoji{font-size:22px}
#nm-info-bar .ib-title{font-weight:700;color:var(--txt);max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nm-info-bar .ib-meta{color:var(--dim);font-size:var(--fsX)}
#nm-info-bar .btn{padding:.3rem .7rem;font-size:var(--fsX)}
/* ★ v4.6.10 徽章归位（双重叠字根因）：components.css 的 .ws-badge 是 lobby 卡片右上角角标（position:absolute;top/right 固定）——本页将其复用为行内徽章（详情报告 meta 行 / 底部信息栏 / 共识 / 检索结果）却未覆盖定位 → 全部徽章脱离文档流叠到最近定位祖先的右上角同一点：①详情弹窗「共识 v0」「📍」等徽章全部飞到弹窗右上角同坐标字符重叠；②信息栏「待同步/☁ 已上传」徽章叠在行尾「✕ 取消」按钮上。本页覆盖为流式胶囊（含中性底色，inline 样式仍可覆盖），lobby 的角标用法不受影响 */
.ws-badge{position:static;display:inline-block;white-space:nowrap;background:rgba(255,255,255,.07);color:var(--mut)}
</style>
</head>
<body>
<div class="st"></div><div class="b b1"></div><div class="b b2"></div>
<header>
<a class="logo" href="/lobby"><span class="s">✦</span> TEAMWORK</a>
<span class="pill" id="h-user"></span>
<span class="pill ld" id="h-phase"><span id="h-phase-text">OPEN</span></span>

<button class="btn btn-s" onclick="location.href='/lobby'" style="padding:.3rem 1rem;font-size:var(--fsS)">← 返回大厅</button>

<div class="view" id="app" style="display:grid;grid-template-columns:250px 1fr 300px;gap:1rem;height:calc(100vh - 58px);overflow:hidden;padding:1rem">
<aside class="pn" style="overflow-y:auto"><h2>✦ 成员</h2><div id="w-members"></div>

<h2 class="sec-h">🧩 Skill</h2><div id="w-skills" class="nm-scroll" style="font-size:var(--fsX);color:var(--dim)">加载中…</div></aside>
<section class="pn" style="position:relative;overflow:hidden;display:flex;flex-direction:column"><h2>🗺 节点地图（爆炸图 · 点击逐层披露 · 单击看信息）</h2>
<div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.1rem 0 .5rem;flex:none">
<div id="nm-tabs">
<button class="nm-tab active" data-tab="all" onclick="setTab('all')">🌐 全部</button>

          <button class="btn btn-s" onclick="fit()">⤢ 适配</button>
          <button class="btn btn-s" onclick="resetLayout()">🧹 重置布局</button>
<button class="btn btn-s" onclick="zoomBy(1.25)">＋</button>
<button class="btn btn-s" onclick="zoomBy(0.8)">－</button>

<button class="btn btn-s" title="功能暂停开放" onclick="uiShow('🔒 检索','当前功能权限不足（功能暂停开放）')">🔍 检索</button>
<button class="btn btn-s" title="功能暂停开放" onclick="uiShow('🔒 云恢复','当前功能权限不足（功能暂停开放）')">☁ 云恢复</button>
</div>
</div>
<svg id="svg" style="flex:1;min-height:0"></svg>
<div id="nm-info-bar"><span class="ib-emoji">🖱</span><span class="ib-meta">滚轮缩放 · 左键拖空白平移 · 左键按住节点拖动微调位置（本机记住）· 单击显示 When·Who·What · 双击打开完整报告</span></div></section>

<script src="/common.js"></script>
<script>
const wsId=location.pathname.split('/')[2];
// ★ v4.6.7 自诊断（v4.6.8 沿用）：任何运行时错误显式暴露（页面底部红条 + console）——事件绑定失败立即可见，不再静默
window.addEventListener('error',e=>{console.error('[workspace v4.6.8] 运行时错误:',e.message,'@',(e.filename||'inline')+':'+e.lineno);
  try{const d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:999;background:#f43f5e;color:#fff;padding:6px 12px;font:12px/1.6 monospace';d.textContent='[v4.6.8] 脚本错误: '+e.message+' @'+e.lineno+'（F12 Console 看详情）';document.body.appendChild(d);}catch(_){}});
window.addEventListener('unhandledrejection',e=>console.error('[workspace v4.6.8] Promise 异常:',e.reason));
let RAW=null,TREE=null,VIEW={x:0,y:0,k:1},EXP=new Set(),SEL=null,drag=null,didFit=false,SHOW_ABANDONED=false,NMTAB='all',SEL_NODE=null;
// ★ v4.6.6 手动节点位置（PINS）：左键拖动节点的显示位置，本机 localStorage 持久化——视图层个人偏好，不进服务器 state、不影响其他成员视图
let PINS={};try{PINS=JSON.parse(localStorage.getItem('nm-pins:'+wsId)||'{}')||{};}catch(e){PINS={};}
function savePins(){try{localStorage.setItem('nm-pins:'+wsId,JSON.stringify(PINS));}catch(e){}}
const EMO={milestone:'⭐',change:'👥',summary:'📋',observation:'💡',decision:'🧭',bugfix:'🐛',feature:'✨',discovery:'🔭',gotcha:'⚠️',revert:'↩️',inherit:'🔗'};
const TCN={milestone:'#fbbf24',change:'#38bdf8',summary:'#34d399',observation:'#a78bfa',decision:'#a78bfa',bugfix:'#f43f5e',feature:'#8b5cf6',discovery:'#38bdf8',gotcha:'#fb923c',revert:'#94a3b8',inherit:'#f472b6'};
const TYPEN={milestone:'里程碑',change:'变动',summary:'摘要',observation:'观察',decision:'决策',bugfix:'修复',feature:'功能',discovery:'发现',gotcha:'坑',revert:'回退',inherit:'继承'};
// ===== 数据 → 爆炸图树 =====
function buildTree(d){
  const nodes=d.nodes||[],tasks=d.tasks||[],byId={},stMap={},taskMap={};
  const m=nodes.find(n=>n.type==='milestone');
  const root={key:'n:'+(m?m.id:'__root'),node:m||{id:'__root',type:'milestone',title:'工作组创建',who:d.leader,when:0},children:[],parent:null,depth:0};
  byId[root.key]=root;
  for(const t of tasks){const k='t:'+t.id;
    const tn={key:k,node:{id:t.id,type:'summary',title:'发布：'+String(t.what).slice(0,40),who:t.publisher||d.leader,when:t.when||0,taskId:t.id},children:[],parent:root,depth:1};
    byId[k]=tn;taskMap[t.id]=tn;root.children.push(tn);}
  for(const t of tasks)for(const s of (t.subtasks||[])){const k='s:'+s.id;
    const sn={key:k,node:{id:s.id,type:'feature',title:String(s.what).slice(0,50),who:s.assignee||'待拾取',when:0,taskId:s.id,st:s},children:[],parent:taskMap[t.id]||root,depth:2};
    byId[k]=sn;stMap[s.id]=sn;(taskMap[t.id]||root).children.push(sn);}
  for(const n of nodes){if(n.type==='milestone')continue;
    const v={key:'n:'+n.id,node:n,children:[],parent:root,depth:1};
    if(n.taskId&&stMap[n.taskId]){v.parent=stMap[n.taskId];}
    else if(n.taskId&&taskMap[n.taskId]){v.parent=taskMap[n.taskId];}
    v.depth=v.parent.depth+1;byId[v.key]=v;v.parent.children.push(v);}
  const sortRec=v=>{v.children.sort((a,b)=>((a.node.when||0)-(b.node.when||0)));v.children.forEach(sortRec);};sortRec(root);
  return {root,byId,stMap,taskMap};
}
// ===== 径向布局（爆炸图：子节点围绕父节点扇形展开）+ v4.6.3 防重叠（叶子数加权扇区 + 碰撞消除兜底）=====
function layoutAll(){const RADII=[150,135,125,115,105,100];const r=TREE.root;r.x=0;r.y=0;
  const GROW=Math.max(1,Math.sqrt(visible().length/24)); // ★ 节点多时整体放大基础半径——源头稀释密度（200 节点实测收敛 6 轮）
  const lw=v=>v.children.length?v.children.reduce((s,c)=>s+lw(c),0):1; // 子树叶子数=扇区权重（子树大→分到更多角度）
  const walk=(v,a0,a1)=>{const cs=v.children;if(!cs.length)return;const tot=cs.reduce((s,c)=>s+lw(c),0);let a=a0;
    cs.forEach(c=>{const sp=(a1-a0)*(lw(c)/tot);c.ang=a+sp/2;
      const R=(RADII[Math.min(c.depth,RADII.length-1)]||95)*GROW;
      c.x=v.x+Math.cos(c.ang)*R;c.y=v.y+Math.sin(c.ang)*R*0.62;
      walk(c,a,a+sp);a+=sp;});};
  walk(r,0,Math.PI*2);relaxOverlap();applyPins();}
// ★ v4.6.6 自动布局 + 碰撞消除完成后，应用本机保存的手动位置（拖拽微调优先于算法排布；不可见节点的 PINS 保留，展开后仍生效）
function applyPins(){for(const k in PINS){const p=PINS[k];if(!p||typeof p.x!=='number'||typeof p.y!=='number')continue;const v=TREE.byId[k];if(!v)continue;v.x=p.x;v.y=p.y;}}
// ★ v4.6.3 碰撞消除：节点盒（圆 r26+展开钮 r9@右上 + 下方 who/lab 两行标签）互不重叠——MPV 最小推离迭代，root 锚定不动
function relaxOverlap(){const vis=visible();if(vis.length<2)return;
  const B=new Map();for(const v of vis){const t=[...String(v.node.title||'')]; // 按字符类型估宽：全角 11px / 半角 6.2px
    const w=t.reduce((s,ch)=>s+(ch.charCodeAt(0)>255?11:6.2),0);B.set(v,{hw:Math.min(115,Math.max(31,w/2+4))});}
  const HT=36,HB=70; // 节点盒上顶（圆顶-31+钮顶-31 取余量）/下底（标签 y56+字高≈68）
  for(let it=0;it<1200;it++){let any=false;const OF=it<80?1.5:1; // 前 80 轮超调加速密集区膨胀
    for(let i=0;i<vis.length;i++)for(let j=i+1;j<vis.length;j++){const a=vis[i],b=vis[j],ba=B.get(a),bb=B.get(b);
      const dx=b.x-a.x,dy=b.y-a.y,ox=ba.hw+bb.hw;
      if(Math.abs(dx)>=ox)continue;
      const oy=Math.min(a.y+HB,b.y+HB)-Math.max(a.y-HT,b.y-HT);if(oy<=0)continue;
      any=true;const pX=ox-Math.abs(dx);
      const ma=a.key===TREE.root.key?0:1,mb=b.key===TREE.root.key?0:1,mt=ma+mb||1; // root 锚定：位移全给对方
      if(pX<=oy){const s=(dx>=0?1:-1)*(pX+1.2)*OF/mt;if(ma)a.x-=s*ma;if(mb)b.x+=s*mb;}
      else{const s=(dy>=0?1:-1)*(oy+1.2)*OF/mt;if(ma)a.y-=s*ma;if(mb)b.y+=s*mb;}}
    if(!any)break;}}
function visible(){const out=[];const walk=v=>{ if(v.node.abandoned&&!SHOW_ABANDONED)return; if(v.node.archived)return; out.push(v); // archived（共识归档）恒隐藏——区别于回退软删的开关可恢复
  if(EXP.has(v.key))for(const c of v.children)walk(c);};walk(TREE.root);return out;}
// ★ v4.3.2 选项卡归属：task(发布/拆解/子任务/认领/完成) chain(继承/回退/占用管理) mem(观察/记忆分享) evt(创建/进出/回收/共识生效)
function tabOf(v){const k=v.key,n=v.node,t=n.type,ttl=String(n.title);
  if(k.indexOf('t:')===0||k.indexOf('s:')===0)return 'task';
  if(t==='inherit'||t==='revert')return 'chain';
  if(t==='change')return ttl.indexOf('拾取：')===0?'task':(ttl.indexOf('加入工作组')>=0||ttl.indexOf('退出工作组')>=0?'evt':'chain');
  if(t==='summary')return 'task'; // 发布/完成
  if(t==='decision')return 'mem'; // decision（含 ⚖️ 共识生效）= 长线记忆——归「记忆」视图（共识经 L-1 层注入全员上下文）
  if(t==='milestone')return 'evt';
  return 'mem';} // observation / share(summary/decision/bugfix/feature/discovery/gotcha)
function drawVis(){const all=visible();return NMTAB==='all'?all:all.filter(v=>tabOf(v)===NMTAB||v.key===TREE.root.key&&false);}
function setTab(t){NMTAB=t;
  document.querySelectorAll('.nm-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  layoutAll();fit();}
function edge(a,b){const mx=(a.x+b.x)/2;return 'M '+a.x+' '+a.y+' C '+mx+' '+a.y+', '+mx+' '+b.y+', '+b.x+' '+b.y;}
// ===== 绘制（父子边 + 任务依赖箭头 + 上下文注入影响虚线 + 节点）=====
function nodeSvg(v){const n=v.node,c=TCN[n.type]||'#38bdf8',e=EMO[n.type]||'💡';
  const tg=v.children.length?'<circle data-act="toggle" cx="22" cy="-22" r="9" fill="'+(EXP.has(v.key)?'#f43f5e':'#34d399')+'" style="cursor:pointer"><title>'+(EXP.has(v.key)?'收起子级':'展开子级')+'</title></circle>':'';
  return '<g class="nm-pop" data-key="'+v.key+'" style="cursor:grab'+(v.node.abandoned?';opacity:.55':'')+'" transform="translate('+v.x+','+v.y+')">'
  +'<circle r="26" fill="rgba(255,255,255,.05)" stroke="'+c+'" stroke-width="2"/>'
  +(SEL_NODE===v.key?'<circle r="31" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="4 3"><title>当前选中</title></circle>':'')
  +'<text text-anchor="middle" y="8" font-size="19">'+e+'</text>'
  +(v.node.abandoned?'<line x1="-19" y1="19" x2="19" y2="-19" stroke="#f43f5e" stroke-width="2.5"/>':'')+tg
  +'<text text-anchor="middle" y="44" class="nm-who">'+esc(String(n.who||'').slice(0,22))+'</text>'
  +'<text text-anchor="middle" y="56" class="nm-lab">'+esc(String(n.title||'').slice(0,20))+'</text>'
  +'<title>'+esc((n.when?fmtT(n.when)+' · ':'')+(n.who||'')+' · '+(n.title||''))+'</title></g>';}

  api('POST','/api/ws/'+wsId+'/consensus',{text:t,key:$('cs-key').value}).then(r=>{
    if(r.error){uiToast(r.error,true);return;}
    uiToast(r.conflict?'⚠ 该 key 已有生效共识——结构冲突，已转 Leader 裁决':'✅ 已提议，等待全员确认');
    renderConsensus();window._consData=null;closeDetail();setTimeout(refresh,200);}).catch(e=>uiToast(e.message,true));} // ★ v4.3.4：提议完成自动关闭弹窗
function doConsAct(p){api('POST','/api/ws/'+wsId+'/consensus',p).then(r=>{
  if(r.error){uiToast(r.error,true);return;}
  uiToast(p.archiveId?('✅ 已归档'+(r.archived?('（'+r.archived+' 个共识节点已从主流程移除并同步云端）'):'')):(p.accept===false?'已驳回':'✅ 已确认'));
  renderConsensus();window._consData=null;closeDetail();setTimeout(refresh,200);}).catch(e=>uiToast(e.message,true));} // ★ v4.3.4：确认/归档后关闭弹窗并刷新地图
function refresh(){api('GET','/api/ws/'+wsId+'/status').then(d=>{if(d.error){uiToast(d.error,true);setTimeout(()=>location.href='/lobby',1400);return;}
  renderSide(d);
  const sig=(d.nodes||[]).length+'|'+(d.tasks||[]).length;
  if(RAW&&RAW.sig===sig){RAW=Object.assign({},RAW,{nodes:d.nodes});return;}
  RAW=Object.assign({},d,{sig});TREE=buildTree(d);
  for(const k of Array.from(EXP))if(!TREE.byId[k])EXP.delete(k);
  if(!EXP.size)EXP.add(TREE.root.key);
  layoutAll();if(!didFit){fit();didFit=true;}else draw();
  if(!_oeChecked){_oeChecked=true; // 首次进入：无身份且有可继承末端 → 自动弹出选择界面
    api('GET','/api/ws/'+wsId+'/open-ends').then(r=>{if(r&&!r.error&&!r.identity&&(r.ends||[]).length)showOpenEnds();}).catch(()=>{});}
  }).catch(()=>location.href='/');}
// ===== 自主继承协议 UI（v4.3 批次二）：末端选择 / 继承 / 回退 =====
let _myName='',_oeChecked=false,_restored=false;
// ★ v4.3.5 shareMemory 真源恢复：每次进入工作组页先从飞书对齐拓扑节点（Cloud Sync 读路径；fail-open）
function restoreFromCloud(force){if(BUSY)return;
  api('GET','/api/ws/'+wsId+'/restore'+(force?'?full=1':'')).then(r=>{ // v4.3.8：进入=map.md 骨架（快）；按钮=full 补全内容
    if(r&&r.ok){uiToast('☁ shareMemory 已对齐（'+(r.full?'全量内容':'骨架')+'）：远端 '+r.remote+' 节点'+(r.restored?('，恢复 '+r.restored+' 个'):'（本地为最新）')+(r.tasks>0?(' + 任务 '+r.tasks+' 条'):'')+(r.ops&&r.ops.length?'，最近操作 '+r.ops[r.ops.length-1].action+' by '+r.ops[r.ops.length-1].who:''));
      if(force||r.restored||r.tasks>0)refresh();}
    else if(r&&r.error){uiToast(r.error,true);}
  }).catch(e=>uiToast(e.message,true));}
// ★ v4.3.8 跟随云文档变更：每 20s 骨架增量对齐（他人经飞书协作修改 map.md / 新增节点 → 自动同步到本地拓扑地图）
let _cloudTimer=null;
function startCloudWatch(){if(_cloudTimer)return;_cloudTimer=setInterval(()=>{
  api('GET','/api/ws/'+wsId+'/restore').then(r=>{
    if(r&&r.ok&&(r.restored>0||r.tasks>0)){uiToast('☁ 云端变更：恢复 '+r.restored+' 个节点'+(r.tasks>0?(' + 任务 '+r.tasks+' 条'):'')+'（来自 NodeMap.md 协作——任务分发/继承/完成跨机可见）');refresh();}
  }).catch(()=>{});},20000);}
function showOpenEnds(){api('GET','/api/ws/'+wsId+'/open-ends').then(r=>{
  if(r.error){uiToast(r.error,true);return;}
  const ends=r.ends||[];
  $('nd-title').textContent='🔗 可继承的末端链路';
  $('nd-sub').textContent=r.identity?('你的身份: '+r.identity+'（同域优先排序）——身份由继承赋予，可选择跨域链路'):'你还没有身份——选择一条链路继承，身份由此赋予（区块链：选链路即得身份）';
  let b=ends.length?ends.map(e=>'<div style="border:1px solid rgba(255,255,255,.08);border-radius:.5rem;padding:.7rem;margin-bottom:.6rem">'
   +'<div style="display:flex;gap:.4rem;flex-wrap:wrap"><span class="ws-badge">'+esc(e.domain)+'</span><span class="ws-badge">📍'+esc(e.topoPath)+'</span>'
   +(e.prevAssignee?'<span class="ws-badge" style="background:rgba(251,191,36,.12);color:#fbbf24">前任: '+esc(e.prevAssignee)+'</span>':'')
   +'<span class="ws-badge">域内记忆 '+e.domainMemCount+'</span></div>'
   +'<div style="margin-top:.4rem;font-size:var(--fsS);color:var(--fg)">'+esc(e.what)+'</div>'
   +(e.lastNode?'<div style="font-size:var(--fsX);color:var(--dim);margin-top:.2rem">末端: '+esc(String(e.lastNode.title).slice(0,40))+' — '+esc(e.lastNode.who+(e.lastNode.whoId?'('+e.lastNode.whoId+')':''))+'</div>':'<div style="font-size:var(--fsX);color:var(--dim);margin-top:.2rem">（全新链路，无前序产出）</div>')
   +'<button class="btn btn-p" style="margin-top:.5rem;padding:.25rem .8rem;font-size:var(--fsX)" onclick="doInherit(\''+e.taskId+'\')">🔗 继承此链路</button></div>').join('')
   :'<div class="emp"><span class="ee">🚀</span><div class="eh">当前没有可继承的末端链路</div><div class="eh">等待 Leader 发布任务或前置依赖解锁</div></div>';
  $('nd-body').innerHTML=b;$('nd-toggle').style.display='none';
  $('nm-detail').style.display='block';}).catch(e=>uiToast(e.message,true));}
function doInherit(taskId){uiConfirm('🔗 继承链路','确认继承 '+taskId+' ？身份将由本次继承赋予，租约开始计时（产出保活）。',()=>{
  api('POST','/api/ws/'+wsId+'/inherit',{taskId:taskId}).then(r=>{
    if(r.error){uiToast(r.error,true);if(r.error.indexOf('占用')>=0)showOpenEnds();return;}
    closeDetail();
    uiShow('✅ 继承成功','身份: '+r.identity+'\n\nInheritBundle（链上信息 + 域内 Memory + 共识，注入参考）:\n'+String(r.bundle||'').replace(/<[^>]+>/g,'').slice(0,800));
    refresh();}).catch(e=>uiToast(e.message,true));});}
function doRevert(taskId){uiPrompt('↩ 回退我的开发链','崩溃原因（强烈建议填写——将沉淀为失败记忆，重新开发时自动注入避免重蹈覆辙）\n区块链语义：只软删你继承点之后的开发链，继承前的祖先拓扑节点不受任何影响','例如：哪个方向走不通 / 卡在哪 / 为什么',
    (reason)=>{api('POST','/api/ws/'+wsId+'/revert',{taskId:taskId,reason:reason}).then(r=>{
    if(r.error){uiShow('⚠ 回退被拒',r.error+(r.impact?'\n\n下游影响清单:\n'+r.impact.map(x=>x.nodeId+' '+x.who+'《'+String(x.title).slice(0,30)+'》').join('\n'):''));return;}
    closeDetail();uiToast('✅ 已回退 '+r.reverted+' 个节点（祖先链 '+r.protected+' 节点受保护），任务回到 ready——从初始继承节点重新开发');refresh();}).catch(e=>uiToast(e.message,true));},'');}
// ===== 批次四：拓扑导航 + 检索面板（三层检索：topo / domain / kw 同域优先）=====
// ★ v4.3.2 底部信息栏：单击节点显示 When·Who·What（双击开完整报告）
function renderInfoBar(key){const v=TREE.byId[key];if(!v)return;const n=v.node;
  const tabs={all:'全部',task:'任务流',chain:'继承链',mem:'记忆',evt:'事件'};
  const bar=$('nm-info-bar');
  bar.innerHTML='<span class="ib-emoji">'+(EMO[n.type]||'💡')+'</span>'
   +'<span class="ib-title" title="'+esc(n.title)+'">'+esc(String(n.title).slice(0,44))+'</span>'
   +'<span class="ib-meta">'+esc(n.who)+' · '+fmtT(n.when)+' · '+(TYPEN[n.type]||n.type)+' · '+tabs[tabOf(v)]+'</span>'
   +(n.topoPath?'<span class="ws-badge">📍'+esc(n.topoPath)+'</span>':'')
   +(n.role?'<span class="ws-badge">'+esc(n.role)+'</span>':'')
   +(n.abandoned?'<span class="ws-badge" style="background:rgba(244,63,94,.15);color:#f43f5e">已回退</span>':'')
   +(key.indexOf('n:')===0?(n.sync==='synced'?'<span class="ws-badge" style="background:rgba(52,211,153,.12);color:#34d399">☁ 已上传</span>':'<span class="ws-badge" style="background:rgba(251,191,36,.12);color:#fbbf24">待同步</span>'):'<span class="ws-badge" style="background:rgba(148,163,184,.12);color:#94a3b8">🧩 结构节点</span>')
   +'<span style="flex:1"></span>'
   +'<button class="btn btn-s" onclick="openDetail(\''+key+'\')">📄 详情报告</button>'
   +(v.children.length?'<button class="btn btn-s" onclick="toggle(\''+key+'\');renderInfoBar(\''+key+'\')">'+(EXP.has(key)?'⊖ 收起('+v.children.length+')':'⊕ 展开('+v.children.length+')')+'</button>':'')
   +'<button class="btn btn-s" onclick="SEL_NODE=null;$(\'nm-info-bar\').innerHTML=\'<span class=\\\'ib-meta\\\'>已取消选中</span>\';draw()">✕ 取消</button>';}
function navTopo(path){closeDetail();
  const seg=String(path).split('/').filter(Boolean);const last=seg[seg.length-1];
  const key=TREE.byId['s:'+last]?'s:'+last:(TREE.byId['t:'+last]?'t:'+last:null);
  if(!key){uiToast('拓扑 '+path+' 无对应节点（路径可能已重组）',true);return;}
  focusNode(key);}
function doSearch(){uiPrompt('🔍 检索工作组记忆','留空 = 最近节点；输入关键词 = 语义检索（你的身份域优先排序）；拓扑检索请点击节点报告中的 📍 徽标','关键词（可留空）',
  (q)=>{api('POST','/api/ws/'+wsId+'/search',{query:q,limit:12}).then(r=>{
    if(r.error){uiToast(r.error,true);return;}
    const rs=r.results||[];
    $('nd-title').textContent='🔍 检索结果'+(q?('「'+q+'」'):'（最近）')+(window._consData?'':'');
    $('nd-sub').textContent=rs.length?rs.length+' 条 · 点击定位节点图位置（身份域优先排序）':'无结果';
    let b=rs.length?rs.map(x=>'<div style="border:1px solid rgba(255,255,255,.08);border-radius:.4rem;padding:.5rem;margin-bottom:.4rem;cursor:pointer" onclick="focusNode(\'n:'+x.id+'\')">'
      +'<div style="display:flex;gap:.4rem;flex-wrap:wrap">'+(EMO[x.type]||'💡')+' <span style="font-size:var(--fsS)">'+esc(String(x.title).slice(0,40))+'</span>'
      +(x.role?'<span class="ws-badge">'+esc(x.role)+'</span>':'')+(x.topoPath?'<span class="ws-badge">📍'+esc(x.topoPath)+'</span>':'')+'</div>'
      +'<div style="font-size:var(--fsX);color:var(--dim);margin-top:.15rem">'+x.id+' · '+esc(x.who)+' · '+fmtT(x.when)+'</div></div>').join('')
      :'<div class="emp"><span class="ee">🕳</span><div class="eh">没有匹配的记忆</div></div>';
    $('nd-body').innerHTML=b;$('nd-toggle').style.display='none';
    $('nm-detail').style.display='block';});}).catch(e=>uiToast(e.message,true));}
function connectSSE(){try{const es=new EventSource('/api/ws/'+wsId+'/events');
  es.addEventListener('status',e=>{try{const s=JSON.parse(e.data);
    if(s.nodeCount!==undefined&&(!RAW||s.nodeCount!==(RAW.nodes||[]).length))refresh();
  }catch(err){}});
  es.onerror=()=>{es.close();console.warn('SSE 断开，降级轮询');startPoll();};}catch(err){startPoll();}}
function startPoll(){setInterval(()=>{api('GET','/api/ws/'+wsId+'/status').then(d=>{if(!d.error)refresh();}).catch(()=>{});},3000);}
// ===== 统一 UI 组件（页面内弹框/Toast，替代浏览器原生 alert/confirm/prompt；风格对齐 form-card/.fg）=====
let _mOk=null;
function uiModal(title,sub,bodyHtml,okText,onOk,hideCancel){
  $('nm-m-title').textContent=title;
  $('nm-m-sub').style.display=sub?'block':'none';$('nm-m-sub').textContent=sub||'';
  $('nm-m-body').innerHTML=bodyHtml||'';$('nm-m-body').style.display=bodyHtml?'block':'none';
  $('nm-m-txt').style.display='none';
  $('nm-m-ok').textContent=okText||'确认';_mOk=onOk;
  $('nm-m-cancel').style.display=hideCancel?'none':'inline-block';
  $('nm-modal').style.display='flex';}
function uiClose(){$('nm-modal').style.display='none';_mOk=null;}
function uiOk(){const f=_mOk;uiClose();if(f)f();}
function uiToast(msg,isErr,ms){const d=document.createElement('div');
  d.className='nm-toast-it'+(isErr?' err':'');d.textContent=msg;
  $('nm-toast').appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .4s';setTimeout(()=>d.remove(),400);},ms||3200);}
function uiConfirm(title,text,onOk){uiModal(title,'',null,'确认',onOk);
  $('nm-m-txt').style.display='block';$('nm-m-txt').textContent=text;}
function uiShow(title,text,okText){uiModal(title,'',null,okText||'知道了',null,true);
  $('nm-m-txt').style.display='block';$('nm-m-txt').textContent=text;}
function uiPrompt(title,sub,placeholder,onOk,def){uiModal(title,sub,
  '<div class="fg"><input id="nm-m-in" placeholder="'+esc(placeholder||'')+'" value="'+esc(def||'')+'"></div>','确认',()=>onOk($('nm-m-in').value));
  setTimeout(()=>{const el=$('nm-m-in');if(el){el.focus();el.select();el.onkeydown=e=>{if(e.key==='Enter')uiOk();};}},50);}
// ===== Leader 发布任务：走 AI 静默链路（MCP teamwork_publish_task → 画像感知拆解 → 默式注入收件箱），Web 无人工表单 =====
checkAuth(()=>{ // ★ v4.3.8：进入工作组先从 shareMemory（飞书真源）对齐拓扑，再渲染节点地图（fail-open：恢复失败照常显示本地）+ 跟随云文档变更 20s 增量对齐
  _restored=true;
  api('GET','/api/ws/'+wsId+'/restore').then(r=>{if(r&&r.ok&&r.restored)uiToast('☁ 已从 shareMemory 恢复 '+r.restored+' 个拓扑节点');})
    .catch(()=>{}).finally(()=>{refresh();bindEvents();connectSSE();startCloudWatch();});});
</script>
<div id="nm-detail" onclick="if(event.target===this)closeDetail()"><div class="form-card">
<h1 id="nd-title"></h1><div class="sub" id="nd-sub"></div><div id="nd-body"></div>
<div style="display:flex;gap:.6rem;margin-top:1rem">
<button class="btn btn-p" style="flex:1;display:none" id="nd-toggle" onclick="toggleFromDetail()"></button>
<button class="btn btn-s" onclick="closeDetail()">关闭</button>
</div></div></div>
<div id="nm-modal" onclick="if(event.target===this)uiClose()"><div class="form-card">
<h1 id="nm-m-title"></h1><div class="sub" id="nm-m-sub" style="display:none"></div>
<div id="nm-m-body"></div><div id="nm-m-txt" style="display:none"></div>
<div style="display:flex;gap:.6rem;margin-top:1.2rem">
<button class="btn btn-p" style="flex:1" id="nm-m-ok" onclick="uiOk()">确认</button>
<button class="btn btn-s" id="nm-m-cancel" onclick="uiClose()">取消</button>
</div></div></div>
<div id="nm-toast"></div>
</body>
